<header class="main-header">
  <div class="header-container">
    <!-- Brand Branding / Logo -->
    <a routerLink="/" class="logo">
      <span class="logo-accent">ECommerce</span>Store
    </a>

    <!-- Navigation Search Bar -->
    <div class="search-bar">
      <input type="text" placeholder="Search products, brands, categories..." aria-label="Search" />
      <button class="search-btn" aria-label="Submit Search">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="icon">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.602 10.602z" />
        </svg>
      </button>
    </div>

    <!-- Right Side Utility Navigation Icons -->
    <nav class="utility-nav">
      <a routerLink="/products" class="nav-link">Shop</a>
      
      <a routerLink="/cart" class="cart-button" aria-label="Shopping Cart">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="icon">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-0.23 2.1-1.041 2.5-2.09l4.2-10.455a0.75 0 00-0.672-1.03H5.34" />
          <circle cx="9" cy="20" r="1" />
          <circle cx="20" cy="20" r="1" />
        </svg>
        
        <!-- The Badge conditionally renders only when there are items inside the cart -->
        @if (cartCount() > 0) {
          <span class="cart-badge animation-pop">{{ cartCount() }}</span>
        }
      </a>
    </nav>
  </div>
</header>
